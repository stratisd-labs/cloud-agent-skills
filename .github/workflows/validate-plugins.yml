name: Validate plugins

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Validate marketplace
        run: pnpm exec claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            pnpm exec claude plugin validate "${manifest%/.claude-plugin/plugin.json}" --strict
          done
