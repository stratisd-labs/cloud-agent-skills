name: Validate plugins

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate marketplace
        run: npx claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            npx claude plugin validate "${manifest%/.claude-plugin/plugin.json}" --strict
          done
