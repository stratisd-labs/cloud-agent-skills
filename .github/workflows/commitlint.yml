name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # commitlint walks the PR's commit range, so it needs the history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm lint:commits --from "$BASE_SHA" --to "$HEAD_SHA"
