name: Claude

# Claude answers and works on demand through the GitHub account named by the
# CLAUDE_GITHUB_USER variable (repo or org). Three ways to summon it:
#   - mention `@<CLAUDE_GITHUB_USER>` in an issue (title or body), an issue or
#     PR comment, a review or a review comment (except
#     `@<CLAUDE_GITHUB_USER> review` in a PR comment, which runs
#     claude-code-review.yml);
#   - assign an issue to `<CLAUDE_GITHUB_USER>`;
#   - add the `claude` label to an issue.
# It reads AGENTS.md and .claude/skills like a local session, replies in a
# single progress comment, and pushes to a `claude/...` branch with a link to
# open the PR. Only users with write access can trigger it; the action ignores
# everyone else. It has no Azure credentials, so it never touches a
# subscription: Azure work stays propose-only.
#
# Setup: install the Claude GitHub App on the repo
# (https://github.com/apps/claude) and add ONE of the secrets ANTHROPIC_API_KEY
# or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`). Optional secret
# CLAUDE_GITHUB_PAT: a fine-grained PAT of that account (contents, issues, pull
# requests: read and write) so replies, commits and PRs show up as that
# account; without it they come from `claude[bot]`. Without the
# CLAUDE_GITHUB_USER variable, only the `claude` label triggers it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    name: Claude
    # Filter here so unrelated comments do not spin up a runner; the action
    # re-checks the trigger itself. The CLAUDE_GITHUB_USER guard matters:
    # unset, the mention would be a bare `@`. `@<CLAUDE_GITHUB_USER> review` on
    # a PR belongs to claude-code-review.yml, which has the review rules.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'claude') || (vars.CLAUDE_GITHUB_USER != '' &&
      (
        (github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, format('@{0}',
      vars.CLAUDE_GITHUB_USER)) &&
          !(github.event.issue.pull_request &&
      contains(github.event.comment.body, format('@{0} review',
      vars.CLAUDE_GITHUB_USER)))) ||
        (github.event_name == 'pull_request_review_comment' &&
      contains(github.event.comment.body, format('@{0}',
      vars.CLAUDE_GITHUB_USER))) ||
        (github.event_name == 'pull_request_review' &&
      contains(github.event.review.body, format('@{0}',
      vars.CLAUDE_GITHUB_USER))) ||
        (github.event_name == 'issues' && (
          (github.event.action == 'opened' && (contains(github.event.issue.body,
      format('@{0}', vars.CLAUDE_GITHUB_USER)) ||
      contains(github.event.issue.title, format('@{0}',
      vars.CLAUDE_GITHUB_USER)))) ||
          (github.event.action == 'assigned' && github.event.assignee.login ==
      vars.CLAUDE_GITHUB_USER)
        ))
      ))
    # Job-level, not workflow-level: a run whose `if` is false must not join
    # the group, or it cancels (or replaces in the queue) the run that does the
    # work. One run per issue or PR at a time; a new mention queues behind the
    # current run.
    concurrency:
      group:
        ${{ github.workflow }}-${{ github.event.issue.number ||
        github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # OIDC: the action exchanges it for a Claude GitHub App token.
      id-token: write
      # Lets Claude read CI results on PRs.
      actions: read
    steps:
      # Full history: commitlint and diffs run against the merge base with
      # main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Installs the pinned maintainer tools so Claude can run the same checks
      # as CI (format, Markdown lint, tests, commitlint) before pushing.
      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_GITHUB_PAT }}
          trigger_phrase:
            ${{ vars.CLAUDE_GITHUB_USER && format('@{0}',
            vars.CLAUDE_GITHUB_USER) || '@claude' }}
          assignee_trigger: ${{ vars.CLAUDE_GITHUB_USER }}
          label_trigger: claude
          base_branch: main
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 100
            --allowedTools "Bash(pnpm format),Bash(pnpm format:check),Bash(pnpm lint:md),Bash(pnpm test),Bash(pnpm lint:commits *),Bash(git diff *),Bash(git log *),Bash(git status*),Bash(git show *),Bash(gh pr *),Bash(gh issue *),Bash(gh run *),WebFetch(domain:learn.microsoft.com)"
            --append-system-prompt "You are running in GitHub Actions on this repository. Follow AGENTS.md and read ARCHITECTURE.md before changing the layout. To create or change a skill, follow .claude/skills/create-skill/SKILL.md. There are no Azure credentials or MCP servers here: never run az, and when a reference file needs an az flag verified against Learn, check it on learn.microsoft.com or tag it '# verify', and say in the PR which flags and read-only commands you could not check. You cannot run pnpm eval; say so in the PR when a skill change needs it. On any change inside a plugin folder, follow the versioning rule in AGENTS.md (plugin.json bump and CHANGELOG.md entry). Before you push, run pnpm format, then pnpm format:check, pnpm lint:md and pnpm test; never push red. Commit messages are Conventional Commits (see AGENTS.md and commitlint.config.mjs); check them with pnpm lint:commits --from origin/main --to HEAD before pushing, since the Commitlint workflow rejects anything else."
